
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>모노폴리 무기 숙련도 재분배 룰렛</title>

  <link rel="stylesheet" href="style.css">

  <!-- 결과 영역의 좌우 배치 및 구분선 -->
  <style>
    #result .result-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr);
      column-gap: 12px;
      align-items: stretch;
      width: 100%;
    }

    #result .result-column {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    #result .result-divider {
      width: 1px;
      align-self: stretch;
      background-color: #999;
    }

    #result .result-title {
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #result .result-subtitle {
      margin-top: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    #result .result-line {
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 360px) {
      #result .result-layout {
        column-gap: 7px;
      }

      #result .result-title {
        font-size: 15px;
      }

      #result .result-line {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>모노폴리 무기 숙련도 재분배 룰렛</h1>

    <div id="characters" class="characters"></div>

    <div class="top-buttons">
      <button id="addCharacterBtn" type="button">
        대상 추가
      </button>

      <button id="firstCollectBtn" type="button">
        1차 수거
      </button>

      <button id="finalRollBtn" type="button">
        최종 수거 및 재분배
      </button>
    </div>

    <div class="result-box">
      <div id="result">

        <div class="result-layout">

          <section class="result-column">
            <div class="result-title">결과:</div>

            <div class="result-subtitle">1차 수거 결과</div>
            <div class="result-line">
              아직 수거하지 않았습니다.
            </div>

            <div class="result-subtitle">2차 수거 결과</div>
            <div class="result-line">
              아직 최종 수거를 진행하지 않았습니다.
            </div>
          </section>

          <div class="result-divider"></div>

          <section class="result-column">
            <div class="result-title">분배 결과:</div>
            <div class="result-line">
              아직 분배 결과가 없습니다.
            </div>
          </section>

        </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
